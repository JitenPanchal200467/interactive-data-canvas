<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1520" />
      <stop offset="100%" stop-color="#050a10" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddbc7" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container with Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3ddbc7" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Neural Network Lattice Background Nodes -->
  <circle cx="16" cy="18" r="2.2" fill="#3ddbc7" fill-opacity="0.4" />
  <circle cx="48" cy="18" r="2.2" fill="#3ddbc7" fill-opacity="0.4" />
  <circle cx="16" cy="46" r="2.2" fill="#3ddbc7" fill-opacity="0.4" />
  <circle cx="48" cy="46" r="2.2" fill="#3ddbc7" fill-opacity="0.4" />
  <line x1="16" y1="18" x2="48" y2="18" stroke="#3ddbc7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2" />
  <line x1="16" y1="46" x2="48" y2="46" stroke="#3ddbc7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2" />
  <line x1="16" y1="18" x2="16" y2="46" stroke="#3ddbc7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2" />
  <line x1="48" y1="18" x2="48" y2="46" stroke="#3ddbc7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2" />

  <!-- Modern Geometric 'J' & AI Data Core Motif -->
  <path
    d="M38 18 H44 V37 C44 43.5 39 48 31 48 C24 48 20 44 19 39.5 L24.5 37 C25.2 39.5 27.5 42 31 42 C34.5 42 37.5 39.8 37.5 36.5 V18 Z"
    fill="url(#cyanGrad)"
    filter="url(#glow)"
  />

  <!-- Active Glowing AI Node Accent -->
  <circle cx="41" cy="18" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="20" cy="41" r="2.5" fill="#3ddbc7" filter="url(#glow)" />
</svg>
